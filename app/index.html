<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard" aria-labelledby="project-pulse-title">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">Contributor overview</p>
          <h1 id="project-pulse-title">Project Pulse</h1>
        </div>
        <div class="summary-badge" aria-label="Projects overview summary">
          <span id="project-count">0</span>
          <small>Active projects</small>
        </div>
      </header>

      <section id="project-grid" class="project-grid" aria-live="polite"></section>
    </main>

    <script>
      async function loadProjects() {
        const response = await fetch('project-data.json');
        const data = await response.json();
        const projects = data.projects || [];

        const projectGrid = document.getElementById('project-grid');
        const projectCount = document.getElementById('project-count');

        projectCount.textContent = String(projects.length);

        projectGrid.innerHTML = projects
          .map(
            (project) => `
              <article class="project-card" aria-label="Project ${project.name}">
                <div class="card-topline">
                  <div>
                    <p class="project-owner">${project.owner}</p>
                    <h2>${project.name}</h2>
                  </div>
                  <span class="status-badge status-${project.status.toLowerCase().replace(/\s+/g, '-')}">${project.status}</span>
                </div>

                <p class="project-summary">${project.recentActivity}</p>

                <div class="meta-row">
                  <div>
                    <span class="label">Priority</span>
                    <strong>${project.priority}</strong>
                  </div>
                  <div>
                    <span class="label">Status</span>
                    <strong>${project.status}</strong>
                  </div>
                </div>
              </article>
            `
          )
          .join('');
      }

      loadProjects();
    </script>
  </body>
</html>
